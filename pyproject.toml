[project]
name = "code-index2"
version = "0.1.0"
description = "Code navigation index for Python codebases, exposed as MCP servers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "motor>=3.6.0",
    "pymongo>=4.9.0",
    "faiss-cpu>=1.9.0",
    "voyageai>=0.3.0",
    "mcp[cli]>=1.2.0",
    "multilspy>=0.0.14",
    "pydash>=8.0.6",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
