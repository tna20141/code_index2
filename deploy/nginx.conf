# nginx site for the code_index2 READ MCP server. TLS terminates here; the app runs on 127.0.0.1:8210 (pm2)
# and is never exposed directly. Only the READ server is public -- the admin server (mutating, spends money
# via claude -p) is NOT proxied here; do seeding/curation on-box or over an SSH tunnel to 127.0.0.1:8211.
#
# The read server is at the ROOT of its host (no path prefix), so the app's own /mcp redirects stay correct
# (a path-prefix proxy would drop the prefix in the app's Location header and break the MCP client).
#
#   https://ci.mavenic.co/mcp   -> read server (127.0.0.1:8210)
#
# TLS: certbot --nginx -d ci.mavenic.co
# Client URL: https://ci.mavenic.co/mcp   (no trailing slash -- the app's mount is /mcp)

server {
    listen 80;
    server_name ci.mavenic.co;

    location / {
        proxy_pass http://127.0.0.1:8210;      # NO trailing slash -> path passed through unchanged
        proxy_http_version 1.1;

        # SSE / streamable-HTTP essentials
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # long-lived: cold spread (jedi index) + claude -p can take minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # forward auth + client info
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
