# nginx site for the code_index2 MCP servers. TLS terminates here; the apps run on 127.0.0.1 (pm2) and are
# never exposed directly. Two servers behind one host via path prefixes:
#   https://<host>/read/mcp/   -> read server  (127.0.0.1:8210)
#   https://<host>/admin/mcp/  -> admin server (127.0.0.1:8211)
#
# Install: copy to /etc/nginx/sites-available/code-index, symlink into sites-enabled, `nginx -t`, reload.
# TLS: run `certbot --nginx -d <host>` after this is in place (it fills the ssl_* lines + the :443 block).
#
# MCP is streamable-HTTP (SSE): buffering MUST be off, and timeouts LONG (a cold spread warms jedi over the
# whole repo; a repo-frontier triggers `claude -p`). Clients send `Authorization: Bearer <token>` -- the app
# enforces it (separate token per server); nginx just forwards the header.

server {
    listen 80;
    server_name YOUR_HOST;              # e.g. code-index.example.com

    # certbot will add the 443 server block + redirect here. Until then this serves plain HTTP.

    # --- read server ---
    location /read/ {
        proxy_pass http://127.0.0.1:8210/;   # trailing slash: strips the /read prefix
        proxy_http_version 1.1;

        # SSE / streamable-HTTP essentials
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # long-lived: cold spread (jedi index) + claude -p can take minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # forward the auth header + client info
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- admin server (mutating + spends money via claude -p; consider an IP allowlist here) ---
    location /admin/ {
        # allow 1.2.3.4;   deny all;   # <- uncomment to restrict admin to known IPs
        proxy_pass http://127.0.0.1:8211/;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
